# LUMIO — statik sayt (Vite build natijasi)
# Joylashuv: /etc/nginx/sites-available/lumio
# Yoqish:   ln -s /etc/nginx/sites-available/lumio /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name lumio.mvendor.uz;

    # Certbot SSL sertifikatini o'rnatgandan keyin bu blokni
    # 443 ga ko'chiradi va bu yerda faqat redirect qoldiradi.
    # Serverda 443 qatorlari `listen 443 ssl http2;` ko'rinishida — HTTP/2
    # barcha fayllarni bitta ulanishda beradi (PageSpeed'da timeout'lar bo'lgan).

    root /var/www/lumio;
    index index.html;

    access_log /var/log/nginx/lumio.access.log;
    error_log  /var/log/nginx/lumio.error.log;

    # Gzip — matnli fayllar uchun
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hash'li asset'lar: uzoq muddatli kesh (fayl nomi o'zgarganda o'zi yangilanadi)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Portfolio rasmlari: bir hafta
    location ~* ^/(design|projects)/ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # HTML hech qachon keshlanmasin — yangi deploy darhol ko'rinsin.
    # Diqqat: `location = /index.html` yetarli emas, chunki foydalanuvchi "/"
    # manzilini so'raydi va o'sha exact-match blok umuman ishlamaydi.
    # Sayt bitta sahifa (til ?lang= orqali), shuning uchun yo'q fayllarga 404:
    # avval index.html qaytarilardi va robotlar uni boshqa fayl deb o'qirdi.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Yashirin fayllarga kirishni yopish
    location ~ /\. {
        deny all;
    }
}
